# Dependabot: proposes dependency updates via pull requests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    # firebase-app-kit is updated by hand with the kit's release process. Dependabot misreads its
    # git tags: it proposed going from v0.10.0 "up" to v0.3.0.
    ignore:
      - dependency-name: firebase-app-kit
    # Minor and patch updates go together in a single PR; major ones, separately.
    groups:
      menores:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  # Keeps the actions used in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns:
          - '*'
    commit-message:
      prefix: ci
